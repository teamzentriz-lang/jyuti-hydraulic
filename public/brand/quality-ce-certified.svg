<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 612" width="612" height="612">
  <defs>
    <!-- Top arc for QUALITY: sweeps over top from left to right -->
    <path id="topArc" d="M 76,306 A 230,230 0 1,1 536,306" fill="none" />
    <!-- Bottom arc for CERTIFICATE: sweeps under bottom from left to right -->
    <path id="botArc" d="M 68,306 A 238,238 0 0,0 544,306" fill="none" />
    <!-- 5-pointed gold star -->
    <polygon id="goldStar" points="0,-13 3.9,-4 13,-4 5.7,2 8.3,11 0,5.5 -8.3,11 -5.7,2 -13,-4 -3.9,-4" fill="#f5b800" />
  </defs>

  <!-- Outer thin blue border -->
  <circle cx="306" cy="306" r="296" fill="none" stroke="#0d5ea6" stroke-width="6" />

  <!-- White gap ring -->
  <circle cx="306" cy="306" r="288" fill="#ffffff" />

  <!-- Solid blue ring -->
  <circle cx="306" cy="306" r="278" fill="#0d5ea6" />

  <!-- Inner circular area with thin blue stroke -->
  <circle cx="306" cy="306" r="192" fill="#ffffff" stroke="#0d5ea6" stroke-width="4" />

  <!-- White divider dots on sides -->
  <circle cx="68" cy="306" r="8" fill="#ffffff" />
  <circle cx="544" cy="306" r="8" fill="#ffffff" />

  <!-- Arc text: QUALITY -->
  <text font-family="'Arial Black', 'Montserrat', Arial, sans-serif" font-weight="900" font-size="46" fill="#ffffff" letter-spacing="12">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">QUALITY</textPath>
  </text>

  <!-- Arc text: CERTIFICATE -->
  <text font-family="'Arial Black', 'Montserrat', Arial, sans-serif" font-weight="900" font-size="36" fill="#ffffff" letter-spacing="8">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">CERTIFICATE</textPath>
  </text>

  <!-- Circle of 10-12 European stars -->
  <g transform="translate(306, 306)">
    <g transform="rotate(0) translate(0, -145)"><use href="#goldStar" /></g>
    <g transform="rotate(30) translate(0, -145)"><use href="#goldStar" /></g>
    <g transform="rotate(60) translate(0, -145)"><use href="#goldStar" /></g>
    <g transform="rotate(90) translate(0, -145)"><use href="#goldStar" /></g>
    <g transform="rotate(120) translate(0, -145)"><use href="#goldStar" /></g>
    <g transform="rotate(150) translate(0, -145)"><use href="#goldStar" /></g>
    <g transform="rotate(180) translate(0, -145)"><use href="#goldStar" /></g>
    <g transform="rotate(210) translate(0, -145)"><use href="#goldStar" /></g>
    <g transform="rotate(240) translate(0, -145)"><use href="#goldStar" /></g>
    <g transform="rotate(270) translate(0, -145)"><use href="#goldStar" /></g>
    <g transform="rotate(300) translate(0, -145)"><use href="#goldStar" /></g>
    <g transform="rotate(330) translate(0, -145)"><use href="#goldStar" /></g>
  </g>

  <!-- CE text in center -->
  <text x="306" y="348" text-anchor="middle" font-family="'Trebuchet MS', 'Arial', sans-serif" font-size="145" font-weight="900" fill="#0d5ea6" letter-spacing="-4">CE</text>
</svg>
